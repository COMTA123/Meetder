services:
  app:
    build: .
    container_name: meetion-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-meetion}:${POSTGRES_PASSWORD:-meetion_pass}@db:5432/${POSTGRES_DB:-meetion}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: node index.js
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: meetion-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetion_pass}
      POSTGRES_DB: ${POSTGRES_DB:-meetion}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: meetion-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
